<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>瞎吃魚 後台</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --ink:#0f1b2d; --muted:#5b6676; --blue:#0b50b0; --blue-d:#083d87; --coral-tint:#fdeee8; --coral-ink:#9a2f14;
          --red:#c0261b; --soft:#f6f7f9; --line:#e4e7ec; --ok:#17794a; --r:14px; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--soft); color:var(--ink); font-family:"Noto Sans TC",-apple-system,"PingFang TC",sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased; }
  [hidden] { display:none !important; }
  button, input, select, textarea { font:inherit; color:inherit; }
  :focus-visible { outline:3px solid var(--blue); outline-offset:2px; }
  .num { font-variant-numeric: tabular-nums; }

  /* 登入 */
  .center { min-height:100vh; display:grid; place-items:center; padding:16px; }
  .panel { width:min(400px,100%); background:#fff; border:1px solid var(--line); border-radius:20px; padding:28px 24px; }
  .panel h1 { margin:0 0 4px; font-size:22px; }
  .panel p.sub { margin:0 0 16px; color:var(--muted); font-size:14px; }
  label.f { display:block; margin:14px 0 4px; font-size:14px; font-weight:500; }
  input[type=text], input[type=password], input[type=date], input[type=number], input:not([type]), select, textarea {
    width:100%; min-height:48px; padding:10px 12px; border:1px solid #c9cfd9; border-radius:10px; background:#fff; font-size:17px; }
  textarea { min-height:80px; }
  .btn { display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 22px; border:1px solid transparent; border-radius:999px; background:var(--blue); color:#fff; font-weight:500; cursor:pointer; }
  .btn:hover { background:var(--blue-d); }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.ghost { background:#fff; color:var(--ink); border-color:var(--line); }
  .btn.danger { background:#fff; color:var(--red); border-color:#f0c4c0; }
  .btn.block { width:100%; }
  .btn.sm { min-height:40px; padding:0 16px; font-size:14px; }
  .linkbtn { background:none; border:0; color:var(--blue); text-decoration:underline; cursor:pointer; padding:12px 0 0; }
  .err { color:var(--red); min-height:1.4em; margin-top:10px; font-size:14px; }

  /* 框架 */
  .top { position:sticky; top:0; z-index:10; background:#fff; border-bottom:1px solid var(--line); }
  .top__in { max-width:960px; margin:auto; display:flex; align-items:center; gap:8px; padding:0 12px; height:56px; }
  .top b { font-size:17px; }
  .top .sp { flex:1; }
  .tabs { max-width:960px; margin:auto; display:flex; gap:2px; padding:0 8px; overflow-x:auto; scrollbar-width:none; }
  .tabs::-webkit-scrollbar { display:none; }
  .tab { flex:none; padding:0 14px; min-height:44px; border:0; background:none; color:var(--muted); font-weight:500; border-bottom:3px solid transparent; cursor:pointer; }
  .tab[aria-selected=true] { color:var(--blue); border-color:var(--blue); }
  main { max-width:960px; margin:auto; padding:16px 12px 120px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:12px; }
  .row { display:flex; align-items:center; gap:10px; }
  .row.wrap { flex-wrap:wrap; }
  .grow { flex:1; min-width:0; }
  .muted { color:var(--muted); font-size:14px; }
  .h { margin:0 0 12px; font-size:18px; }
  .pill { display:inline-block; padding:1px 10px; border-radius:999px; font-size:13px; background:var(--soft); border:1px solid var(--line); }
  .pill.live { background:var(--coral-tint); color:var(--coral-ink); border-color:transparent; }
  .pill.off { color:var(--muted); }
  .neg { color:var(--red); }
  .cost { color:var(--red); }          /* 成本用紅字 */
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
  .chip { min-height:40px; padding:0 16px; border:1px solid var(--line); background:#fff; border-radius:999px; cursor:pointer; }
  .chip[aria-pressed=true] { background:var(--ink); color:#fff; border-color:var(--ink); }

  /* 列表列 */
  .item { display:flex; align-items:center; gap:12px; padding:12px 14px; background:#fff; border:1px solid var(--line); border-radius:var(--r); margin-bottom:8px; cursor:pointer; width:100%; text-align:left; }
  .item:hover { border-color:#b9c1ce; }
  .item .t { font-weight:500; }
  .item .r { text-align:right; }

  /* 出車表單 */
  .sumbar { position:sticky; bottom:0; z-index:9; background:#fff; border-top:1px solid var(--line); box-shadow:0 -6px 20px rgba(15,27,45,.06); }
  .sumbar__in { max-width:960px; margin:auto; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
  .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; text-align:center; margin-bottom:8px; }
  .kpis small { display:block; color:var(--muted); font-size:12px; }
  .kpis b { font-size:20px; }
  .line { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-top:8px; }
  .line .nm { grid-column:1 / -1; display:flex; gap:8px; align-items:center; }
  .line .nm input { font-weight:500; }
  .fld small { display:block; color:var(--muted); font-size:12px; margin-bottom:2px; }
  .fld input { text-align:right; padding:8px 10px; min-height:46px; }
  .line.zero { opacity:.55; }
  .line.zero:focus-within, .line.zero:hover { opacity:1; }
  .subt { grid-column:1 / -1; text-align:right; color:var(--muted); font-size:13px; }
  .xbtn { width:44px; height:44px; border:0; background:none; font-size:18px; color:var(--muted); cursor:pointer; border-radius:50%; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:#fff; }
  .seg button { border:0; background:none; padding:0 20px; min-height:44px; cursor:pointer; }
  .seg button[aria-pressed=true] { background:var(--ink); color:#fff; }
  .cashgrid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  @media (max-width:520px) { .cashgrid { grid-template-columns:repeat(3,1fr); } }
  .alert { margin-top:8px; padding:10px 12px; border-radius:10px; font-size:14px; }
  .alert.bad { background:#fdecea; color:var(--red); border:1px solid #f4c2be; }
  .alert.ok { background:#e9f6ef; color:var(--ok); }
  .alert.info { background:var(--soft); color:var(--muted); }

  /* 彈出視窗 */
  .modal { position:fixed; inset:0; z-index:30; background:rgba(15,27,45,.45); display:grid; place-items:end center; }
  @media (min-width:640px) { .modal { place-items:center; } }
  .sheet { width:min(520px,100%); max-height:92vh; overflow:auto; background:#fff; border-radius:20px 20px 0 0; padding:20px; }
  @media (min-width:640px) { .sheet { border-radius:20px; } }
  .sheet h2 { margin:0 0 4px; font-size:19px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .tbl { width:100%; border-collapse:collapse; font-size:14px; }
  .tbl th, .tbl td { padding:8px 6px; border-bottom:1px solid var(--line); text-align:right; white-space:nowrap; }
  .tbl th:first-child, .tbl td:first-child { text-align:left; white-space:normal; }
  .tbl th { color:var(--muted); font-weight:500; font-size:13px; }
  .scroll { overflow-x:auto; }
  .st { display:inline-block; padding:1px 10px; border-radius:999px; font-size:13px; background:var(--soft); border:1px solid var(--line); }
  .st.s1 { background:#fff4d6; border-color:transparent; color:#7a5a00; } .st.s2 { background:#fdeee8; border-color:transparent; color:var(--coral-ink); }
  .st.s3 { background:#e5eefc; border-color:transparent; color:var(--blue-d); } .st.s4 { background:#e9f6ef; border-color:transparent; color:var(--ok); } .st.s5 { background:var(--soft); color:var(--muted); }
  .low { color:var(--red); font-weight:500; }
  textarea.mono { font:13px/1.5 ui-monospace,Menlo,monospace; min-height:160px; }
  .toast { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 20px; border-radius:999px; z-index:50; font-size:14px; }
  .switch { width:52px; height:32px; border-radius:999px; border:0; background:#c9cfd9; position:relative; cursor:pointer; flex:none; }
  .switch::after { content:""; position:absolute; top:3px; left:3px; width:26px; height:26px; border-radius:50%; background:#fff; transition:left .15s; }
  .switch[aria-checked=true] { background:var(--blue); }
  .switch[aria-checked=true]::after { left:23px; }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>

<!-- 登入 -->
<div class="center" id="login">
  <div class="panel">
    <h1>瞎吃魚 後台</h1>
    <p class="sub" id="loginSub">請登入</p>
    <label class="f" for="u">登入名稱</label>
    <input id="u" autocomplete="username" autocapitalize="none" autocorrect="off">
    <div id="setupRow" hidden>
      <label class="f" for="code">一次性設定碼</label>
      <input id="code" autocomplete="off" autocapitalize="none">
    </div>
    <label class="f" for="p" id="plabel">密碼</label>
    <input id="p" type="password" autocomplete="current-password">
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn block" id="go">登入</button>
    <button class="linkbtn" id="toggle">第一次登入？用設定碼設定密碼</button>
  </div>
</div>

<!-- 主畫面 -->
<div id="app" hidden>
  <header class="top">
    <div class="top__in">
      <b>瞎吃魚 後台</b><span class="sp"></span>
      <span class="muted" id="who"></span>
      <button class="btn ghost sm" id="menuBtn">帳號</button>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-v="trips" aria-selected="true">出車記帳</button>
      <button class="tab" role="tab" data-v="orders" aria-selected="false">訂單</button>
      <button class="tab" role="tab" data-v="customers" aria-selected="false">客戶</button>
      <button class="tab" role="tab" data-v="stock" aria-selected="false">庫存</button>
      <button class="tab" role="tab" data-v="report" aria-selected="false">報表</button>
      <button class="tab" role="tab" data-v="products" aria-selected="false">商品</button>
      <button class="tab" role="tab" data-v="settings" aria-selected="false">設定</button>
    </div>
  </header>
  <main id="view"></main>
</div>

<div id="modalRoot"></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
/* 在 GitHub Pages 上執行時沒有 google.script.run，改用 fetch 呼叫 Apps Script 的 doPost；在 Apps Script 內執行時不啟用。 */
(function () {
  if (window.google && window.google.script) return;
  var API = 'https://script.google.com/macros/s/AKfycbxcgcFzv_4K0gKSB-Np4354S_r02I1SmKXdrCKRw3XKg6tlgkCxHKoc5azF0RhbsgXDcA/exec';
  function mk(ok, err) {
    var base = { withSuccessHandler: function (f) { return mk(f, err); }, withFailureHandler: function (f) { return mk(ok, f); } };
    return new Proxy(base, { get: function (t, k) {
      if (k in t) return t[k];
      return function () {
        var args = [].slice.call(arguments);
        fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: String(k), args: args }) })
          .then(function (r) { return r.json(); })
          .then(function (d) { if (d.e) throw new Error(d.e); return d.r; })
          .then(function (r) { if (ok) ok(r); }, function (e) { if (err) err(e.message === 'Failed to fetch' ? new Error('連線失敗，請檢查網路') : e); });
      };
    } });
  }
  window.google = { script: { run: mk() } };
})();
</script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var token = null, user = '', view = 'trips';
  var CACHE = {};
  function swr(key, promise, draw, onErr) { if (CACHE[key]) draw(CACHE[key]); promise.then(function (r) { CACHE[key] = r; draw(r); }, function (e) { if (!CACHE[key]) onErr(e); }); }
  var state = { products: [], pFilter: { cat: '全部', q: '' }, month: monthOf(new Date()), names: [] };

  /* ---------- 工具 ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { n = Math.round(Number(n) || 0); return (n < 0 ? '−$' : '$') + Math.abs(n).toLocaleString('en-US'); }
  function r2(n) { return Math.round(n * 100) / 100; }
  function num(v) { var n = parseFloat(v); return isFinite(n) ? n : 0; }
  function pad(n) { return ('0' + n).slice(-2); }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function monthOf(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1); }
  var tt; function toast(m) { var t = $('toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(function () { t.hidden = true; }, 2400); }
  function store(k, v) { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }

  function call(fn) {
    var args = [].slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var run = google.script.run.withSuccessHandler(function (r) { if (/^api_(save|delete|set|stockMove|import)/.test(fn)) CACHE = {}; resolve(r); }).withFailureHandler(function (e) {
        var m = (e && e.message) || '連線失敗';
        if (m.indexOf('未登入') >= 0) { logout(true); }
        reject(new Error(m.replace(/^Error:\s*/, '')));
      });
      run[fn].apply(run, args);
    });
  }
  function authed(fn) { return call.apply(null, [fn, token].concat([].slice.call(arguments, 1))); }

  /* ---------- 登入 ---------- */
  var setupMode = false;
  $('toggle').onclick = function () {
    setupMode = !setupMode;
    $('setupRow').hidden = !setupMode;
    $('plabel').textContent = setupMode ? '新密碼（至少 8 碼，不要與其他網站共用）' : '密碼';
    $('p').autocomplete = setupMode ? 'new-password' : 'current-password';
    $('go').textContent = setupMode ? '設定密碼並登入' : '登入';
    $('toggle').textContent = setupMode ? '已有密碼？回登入' : '第一次登入？用設定碼設定密碼';
    $('loginErr').textContent = '';
  };
  function doLogin() {
    $('loginErr').textContent = ''; $('go').disabled = true;
    var p = setupMode ? call('api_setupPassword', $('u').value, $('code').value, $('p').value) : call('api_login', $('u').value, $('p').value);
    p.then(function (r) {
      $('go').disabled = false;
      if (!r || !r.ok) { $('loginErr').textContent = (r && r.error) || '失敗'; return; }
      token = r.token; user = r.username; store('xcy_tok', token); store('xcy_user', user);
      $('p').value = ''; $('code').value = '';
      enter();
    }).catch(function (e) { $('go').disabled = false; $('loginErr').textContent = e.message; });
  }
  $('go').onclick = doLogin;
  $('p').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });

  function logout(silent) {
    if (token && !silent) { try { google.script.run.api_logout(token); } catch (e) {} }
    token = null; store('xcy_tok', null); store('xcy_user', null);
    $('app').hidden = true; $('login').hidden = false; closeModal();
    if (silent) $('loginErr').textContent = '登入已逾時，請重新登入';
  }

  function enter() {
    $('login').hidden = true; $('app').hidden = false; $('who').textContent = user;
    go(view);
  }

  var saved = load('xcy_tok');
  if (saved) {
    token = saved; user = load('xcy_user') || '';
    call('api_whoami', token).then(function (r) { user = r.username; enter(); }).catch(function () { token = null; store('xcy_tok', null); });
  }

  /* ---------- 導覽 ---------- */
  [].forEach.call(document.querySelectorAll('.tab'), function (b) {
    b.onclick = function () { go(b.getAttribute('data-v')); };
  });
  function go(v) {
    view = v;
    [].forEach.call(document.querySelectorAll('.tab'), function (b) { b.setAttribute('aria-selected', b.getAttribute('data-v') === v ? 'true' : 'false'); });
    var f = { trips: tripsList, orders: ordersList, customers: customersView, stock: stockView, report: reportView, products: productsView, settings: settingsView }[v];
    f();
  }
  $('menuBtn').onclick = accountModal;

  /* ---------- 彈出視窗 ---------- */
  function openModal(html) {
    $('modalRoot').innerHTML = '<div class="modal" id="modal"><div class="sheet" role="dialog" aria-modal="true">' + html + '</div></div>';
    $('modal').addEventListener('mousedown', function (e) { if (e.target === $('modal')) closeModal(); });
    var f = $('modal').querySelector('input,select,button'); if (f) f.focus();
    return $('modal');
  }
  function closeModal() { $('modalRoot').innerHTML = ''; }
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });

  function accountModal() {
    var m = openModal('<h2>' + esc(user) + '</h2><p class="muted">修改密碼（至少 8 碼）</p>' +
      '<label class="f" for="op">舊密碼</label><input id="op" type="password" autocomplete="current-password">' +
      '<label class="f" for="np">新密碼</label><input id="np" type="password" autocomplete="new-password">' +
      '<div class="err" id="aerr" role="alert"></div>' +
      '<div class="row" style="margin-top:12px"><button class="btn grow" id="chg">修改密碼</button><button class="btn ghost" id="lo">登出</button></div>');
    $('lo').onclick = function () { logout(); };
    $('chg').onclick = function () {
      $('chg').disabled = true; $('aerr').textContent = '';
      authed('api_changePassword', $('op').value, $('np').value).then(function (r) {
        $('chg').disabled = false;
        if (!r.ok) { $('aerr').textContent = r.error; return; }
        closeModal(); toast('密碼已修改');
      }).catch(function (e) { $('chg').disabled = false; $('aerr').textContent = e.message; });
    };
  }

  /* =====================  出車記帳  ===================== */
  function tripsList() {
    var v = $('view');
    v.innerHTML = '<div class="row wrap" style="margin-bottom:12px"><input type="month" id="mon" value="' + esc(state.month) + '" style="width:auto">' +
      '<span class="grow"></span><button class="btn" id="newTrip">+ 新增場次</button></div><div id="tlist" class="muted">載入中…</div>';
    $('newTrip').onclick = function () { tripForm(null); };
    $('mon').onchange = function () { state.month = this.value; tripsList(); };
    swr('trips:' + state.month, authed('api_listTrips', state.month), function (r) {
      var h = '<div class="card"><div class="kpis"><div><small>本月進帳</small><b class="num">' + money(r.sum.income) + '</b></div>' +
        '<div><small>成本</small><b class="num cost">' + money(r.sum.cost) + '</b></div><div><small>淨額</small><b class="num">' + money(r.sum.net) + '</b></div></div></div>';
      if (!r.trips.length) h += '<p class="muted">這個月還沒有出車紀錄。</p>';
      r.trips.forEach(function (t) {
        var bad = Math.abs(num(t.diff)) >= 0.5 && num(t.counted) > 0;
        h += '<button class="item" data-id="' + esc(t.id) + '"><div class="grow"><div class="t">' + esc(t.date) +
          ' <span class="pill ' + (t.type === '活體' ? 'live' : '') + '">' + esc(t.type) + '</span></div><div class="muted">' + esc(t.place) +
          (bad ? ' <span class="neg">· 差額 ' + money(t.diff) + '</span>' : '') + '</div></div>' +
          '<div class="r num"><div class="t">' + money(t.income) + '</div><div class="muted">淨 ' + money(t.net) + '</div></div></button>';
      });
      $('tlist').className = ''; $('tlist').innerHTML = h;
      [].forEach.call(document.querySelectorAll('.item[data-id]'), function (b) { b.onclick = function () { tripForm(b.getAttribute('data-id')); }; });
    }, function (e) { $('tlist').textContent = e.message; });
  }

  var DENOMS = [1000, 500, 100, 50, 10, 5, 1];
  var T = null; // 目前編輯的場次

  function tripForm(id) {
    $('view').innerHTML = '<p class="muted">載入中…</p>';
    var p = id ? authed('api_getTrip', id).then(function (r) { if (!r.ok) throw new Error(r.error); return r.trip; })
               : authed('api_tripDefaults', '活體').then(function (d) { return newTrip('活體', d); });
    p.then(function (t) {
      T = t; T._new = !id; if (id) { T.remIdx = -1; T.auto = false; } renderTripForm();
      authed('api_listProducts').then(function (r) { state.products = r.products; state.names = r.products.map(function (x) { return x['品名']; }); });
    }).catch(function (e) { $('view').innerHTML = '<p class="neg">' + esc(e.message) + '</p><button class="btn ghost" id="bk">返回</button>'; $('bk').onclick = tripsList; });
  }

  function newTrip(type, d) {
    var t = { id: '', date: todayStr(), place: d.place, type: type, items: d.items, cash: {}, petty: d.petty, transfer: '', note: '', _fresh: true };
    t.remIdx = findRem(t.items); t.auto = t.remIdx >= 0;
    return t;
  }

  function findRem(items) { for (var i = 0; i < items.length; i++) if (items[i].name === '白蝦') return i; return -1; }

  function calc() {
    var income = 0, cost = 0;
    T.items.forEach(function (it) { income += r2(num(it.weight) * num(it.price)); cost += r2(num(it.weight) * num(it.cost)); });
    var counted = 0; DENOMS.forEach(function (d) { counted += d * Math.floor(num(T.cash[d])); });
    var cashIncome = counted - num(T.petty);
    return { income: r2(income), cost: r2(cost), net: r2(income - cost), counted: counted, cashIncome: cashIncome, diff: r2(income - cashIncome - num(T.transfer)) };
  }

  function renderItems() {

  function syncAuto() { var sw = $('autoSw'); if (sw) sw.setAttribute('aria-checked', !!T.auto); }

  /* 進帳 = 現金收入 + 轉帳收入；餘量品項的重量 = (進帳 − 其他品項進帳) ÷ 單價 */
  function autoCalc() {
    var note = $('remNote'); if (!note) return;
    var it = T.items[T.remIdx];
    if (!T.auto || !it) { note.textContent = T.remIdx >= 0 && it ? '手動輸入中，開啟後會自動算「' + it.name + '」' : '先在某個品項按「餘量」，即可由進帳自動算出它的重量'; return; }
    var counted = 0; DENOMS.forEach(function (d) { counted += d * Math.floor(num(T.cash[d])); });
    if (counted === 0 && !num(T.transfer)) { note.textContent = '先輸入上面的點鈔與轉帳，才能算「' + it.name + '」的餘量'; return; }
    var target = counted - num(T.petty) + num(T.transfer), known = 0;
    T.items.forEach(function (x, j) { if (j !== T.remIdx) known += r2(num(x.weight) * num(x.price)); });
    var rem = r2(target - known), price = num(it.price);
    var w = (rem > 0 && price > 0) ? Math.round(rem / price * 10000) / 10000 : 0;
    it.weight = w || '';
    var inp = document.querySelector('#items .line[data-i="' + T.remIdx + '"] [data-f=weight]');
    if (inp && document.activeElement !== inp) inp.value = it.weight;
    var row = document.querySelector('#items .line[data-i="' + T.remIdx + '"]'); if (row) row.classList.toggle('zero', !w);
    note.textContent = rem < 0 ? '其他品項的進帳已超過 ' + money(target) + '，請核對' : '進帳 ' + money(target) + ' − 其他品項 ' + money(known) + ' = 「' + it.name + '」' + money(rem) + (price > 0 ? '（' + (w || 0) + ' 斤）' : '，請先填單價');
    note.style.color = rem < 0 ? 'var(--red)' : '';
  }

  function refresh() {
    autoCalc();
    var c = calc();
    if (!$('kI')) return;
    $('kI').textContent = money(c.income); $('kC').textContent = money(c.cost); $('kN').textContent = money(c.net);
    T.items.forEach(function (it, i) {
      var s = document.querySelector('[data-sub="' + i + '"]');
      if (s) s.textContent = '小計 進帳 ' + money(num(it.weight) * num(it.price)) + '　成本 ' + money(num(it.weight) * num(it.cost));
    });
    var info = '<div class="muted num" style="margin-top:10px">點鈔總額 ' + money(c.counted) + '　現金收入 ' + money(c.cashIncome) + '（點鈔總額 − 零用金）</div>';
    if (c.counted === 0 && !num(T.transfer)) info += '<div class="alert info">還沒輸入點鈔與轉帳，差額暫不檢查。</div>';
    else if (Math.abs(c.diff) >= 0.5) info += '<div class="alert bad" role="alert">差額 ' + money(c.diff) + '：進帳 − 現金收入 − 轉帳收入 應為 0，請再核對。</div>';
    else info += '<div class="alert ok">差額 $0，帳目吻合。</div>';
    info += '<div class="muted" style="margin-top:8px">下次需留零用金 <b class="num">' + money(T.petty) + '</b>，會自動帶到下一場。</div>';
    $('cashInfo').innerHTML = info;
  }

  function saveTrip() {
    $('terr').textContent = ''; $('saveTrip').disabled = true;
    var payload = JSON.parse(JSON.stringify(T)); delete payload._new; delete payload._fresh; delete payload.remIdx; delete payload.auto;
    payload.items = payload.items.filter(function (i) { return String(i.name).trim() !== ''; });
    authed('api_saveTrip', payload).then(function (r) {
      $('saveTrip').disabled = false;
      if (!r.ok) { $('terr').textContent = r.error; return; }       // 失敗時保留畫面輸入
      toast('已儲存：進帳 ' + money(r.summary.income) + '、淨額 ' + money(r.summary.net));
      state.month = T.date.slice(0, 7); tripsList();
    }).catch(function (e) { $('saveTrip').disabled = false; $('terr').textContent = e.message; });
  }

    var csv = rows.map(function (r) { return r.map(function (c) { c = String(c == null ? '' : c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\n');
    openModal('<h2>' + esc(name) + '</h2><p class="muted">按「下載」存成檔案；若沒有反應，請複製下方文字貼到試算表。</p><textarea class="mono" id="csvt" readonly></textarea>' +
      '<div class="row" style="margin-top:12px"><button class="btn grow" id="csvd">下載</button><button class="btn ghost" id="csvc">複製</button><button class="btn ghost" id="csvx">關閉</button></div>');
    $('csvt').value = csv;
    $('csvx').onclick = closeModal;
    $('csvc').onclick = function () { $('csvt').select(); try { document.execCommand('copy'); toast('已複製'); } catch (e) { toast('請長按文字手動複製'); } };
    $('csvd').onclick = function () {
      try { var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
      catch (e) { toast('下載不了，請用「複製」'); }
    };
  }

  /* =====================  設定  ===================== */
  function settingsView() {
    $('view').innerHTML = '<p class="muted">載入中…</p>';
    authed('api_listSettings').then(function (r) {
      var h = '<div class="card"><h3 class="h">網站內容（儲存後前台會同步）</h3>' + r.settings.map(function (s, i) {
        return '<label class="f" for="set' + i + '">' + esc(s.label || s.key) + '</label>' + (String(s.value).length > 40 ? '<textarea id="set' + i + '" data-k="' + esc(s.key) + '">' + esc(s.value) + '</textarea>' : '<input id="set' + i + '" data-k="' + esc(s.key) + '" value="' + esc(s.value) + '">');
      }).join('') + '<div class="err" id="seterr" role="alert"></div><button class="btn block" id="setsave" style="margin-top:12px">儲存設定</button></div>' +
        '<div class="card"><h3 class="h">匯入歷史月報表</h3><p class="muted">把「2026活蝦出車 月報表」的二月、五月到九月共 31 場匯進出車記帳。可重複按，已匯入的不會重複寫入。</p><button class="btn ghost" id="imp">匯入歷史月報表</button></div>';
      $('view').innerHTML = h;
      $('setsave').onclick = function () {
        var vals = {}; [].forEach.call(document.querySelectorAll('[data-k]'), function (e) { vals[e.getAttribute('data-k')] = e.value; });
        $('setsave').disabled = true; $('seterr').textContent = '';
        authed('api_saveSettings', vals).then(function (x) { $('setsave').disabled = false; if (!x.ok) { $('seterr').textContent = x.error; return; } toast('已儲存'); }).catch(function (e) { $('setsave').disabled = false; $('seterr').textContent = e.message; });
      };
      $('imp').onclick = function () {
        openModal('<h2>匯入歷史月報表？</h2><p class="muted">共 31 場（活體，2026 年二月、五到九月）。已匯入過的場次會自動略過。</p><div class="row"><button class="btn grow" id="yes">匯入</button><button class="btn ghost grow" id="no">取消</button></div>');
        $('no').onclick = closeModal;
        $('yes').onclick = function () { $('yes').disabled = true; $('yes').textContent = '匯入中…'; authed('api_importHistory').then(function (x) { closeModal(); toast(x.ok ? '匯入 ' + x.imported + ' 場，略過 ' + x.skipped + ' 場' : x.error); }).catch(function (e) { closeModal(); toast(e.message); }); };
      };
    }).catch(function (e) { fail($('view'), e); });
  }

})();
</script>
</body>
</html>
